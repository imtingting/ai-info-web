name: Backfill README context

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enrich-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STATE_REPO: ${{ secrets.STATE_REPO }}
      STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      CHAT_API_URL: ${{ vars.CHAT_API_URL }}
      # A deliberately small batch keeps individual GitHub or homepage
      # timeouts away from the 20-minute publication workflow.
      GITHUB_MAX_ENRICHMENT_ITEMS: "2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Restore private state
        run: |
          set -euo pipefail
          test -n "$STATE_REPO"
          test -n "$STATE_REPO_TOKEN"
          git clone --depth=1 "https://x-access-token:${STATE_REPO_TOKEN}@github.com/${STATE_REPO}.git" "$RUNNER_TEMP/state"
      - name: Backfill README context and build static package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work"
          PYTHONPATH=src python -m ai_info_web.cli enrich-readmes \
            --db "$RUNNER_TEMP/work/ai-info-web.sqlite3" \
            --state-dir "$RUNNER_TEMP/state"
          PYTHONPATH=src python -m ai_info_web.cli build-static \
            --db "$RUNNER_TEMP/work/ai-info-web.sqlite3" \
            --output "$RUNNER_TEMP/public"
      - name: Commit private state after successful backfill
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/state"
          git config user.name "ai-info-web-actions"
          git config user.email "ai-info-web-actions@users.noreply.github.com"
          git add ai-info-web.sqlite3
          git diff --cached --quiet || git commit -m "chore: persist README enrichment state"
          git push
      - name: Publish verified CloudBase upload package
        uses: actions/upload-artifact@v4
        with:
          name: cloudbase-static-site
          path: ${{ runner.temp }}/public
          if-no-files-found: error
          retention-days: 7
