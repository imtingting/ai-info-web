name: Backfill Chinese summaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summarize-and-build:
    runs-on: ubuntu-latest
    # Summary generation plus a full CloudBase static upload can exceed the
    # old 12-minute build-only limit when the hosting service is busy.
    timeout-minutes: 25
    env:
      STATE_REPO: ${{ secrets.STATE_REPO }}
      STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CHAT_API_URL: ${{ vars.CHAT_API_URL }}
      TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
      TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
      CLOUDBASE_DEPLOY_PATH: ${{ vars.CLOUDBASE_DEPLOY_PATH }}
      SUMMARY_MAX_ITEMS: "10"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Restore private state
        run: |
          set -euo pipefail
          test -n "$STATE_REPO"
          test -n "$STATE_REPO_TOKEN"
          git clone --depth=1 "https://x-access-token:${STATE_REPO_TOKEN}@github.com/${STATE_REPO}.git" "$RUNNER_TEMP/state"
      - name: Backfill Chinese summaries and build static package
        run: |
          set -euo pipefail
          test -n "$DEEPSEEK_API_KEY"
          mkdir -p "$RUNNER_TEMP/work"
          SUMMARY_RESULT="$(PYTHONPATH=src python -m ai_info_web.cli summarize \
            --db "$RUNNER_TEMP/work/ai-info-web.sqlite3" \
            --state-dir "$RUNNER_TEMP/state")"
          echo "$SUMMARY_RESULT"
          SUMMARY_FAILED="$(jq -r '.failed' <<<"$SUMMARY_RESULT")"
          SUMMARY_GENERATED="$(jq -r '.generated' <<<"$SUMMARY_RESULT")"
          if [ "$SUMMARY_FAILED" -gt 0 ] && [ "$SUMMARY_GENERATED" -eq 0 ]; then
            echo "DeepSeek generated no summaries: $(jq -r '.last_error' <<<"$SUMMARY_RESULT")" >&2
            exit 1
          fi
          PYTHONPATH=src python -m ai_info_web.cli build-static \
            --db "$RUNNER_TEMP/work/ai-info-web.sqlite3" \
            --output "$RUNNER_TEMP/public"
          SUMMARY_OK="$(jq '[.products[] | select(.summary_status == "ok")] | length' "$RUNNER_TEMP/public/data/products.json")"
          test "$SUMMARY_OK" -gt 0
          echo "Verified $SUMMARY_OK published products with DeepSeek summaries."
      - name: Commit private state after successful summary backfill
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/state"
          git config user.name "ai-info-web-actions"
          git config user.email "ai-info-web-actions@users.noreply.github.com"
          git add ai-info-web.sqlite3
          git diff --cached --quiet || git commit -m "chore: persist Chinese summary state"
          git push
      - name: Publish verified CloudBase upload package
        uses: actions/upload-artifact@v4
        with:
          name: cloudbase-static-site
          path: ${{ runner.temp }}/public
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install CloudBase CLI
        run: |
          npm install -g @cloudbase/cli || \
            npm install -g @cloudbase/cli --registry=http://mirrors.cloud.tencent.com/npm/
      - name: Deploy summary backfill to CloudBase Static Hosting
        env:
          CI: "true"
          COS_SDK_KEEPALIVE: "false"
        run: |
          set -euo pipefail
          test -n "$TCB_SECRET_ID"
          test -n "$TCB_SECRET_KEY"
          test -n "$TCB_ENV_ID"
          DEPLOY_PATH="${CLOUDBASE_DEPLOY_PATH:-/ai-info-web}"
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
          tcb hosting deploy "$RUNNER_TEMP/public" "$DEPLOY_PATH" \
            -e "$TCB_ENV_ID"
