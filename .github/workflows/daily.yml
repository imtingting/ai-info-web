name: Daily AI product intelligence

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      bootstrap_static:
        description: "Build the first static package without optional GitHub enrichment."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STATE_REPO: ${{ secrets.STATE_REPO }}
      STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CHAT_API_URL: ${{ vars.CHAT_API_URL }}
      # Bootstrap publication skips non-critical enrichment. Scheduled runs
      # retain bounded enrichment and prefill so later snapshots fill it in.
      GITHUB_MAX_ENRICHMENT_ITEMS: ${{ inputs.bootstrap_static && '0' || '8' }}
      GITHUB_MAX_STARGAZER_PREFILL_ITEMS: ${{ inputs.bootstrap_static && '0' || '5' }}
      GITHUB_MAX_STARGAZER_PAGES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Restore private state
        run: |
          set -euo pipefail
          test -n "$STATE_REPO"
          test -n "$STATE_REPO_TOKEN"
          git clone --depth=1 "https://x-access-token:${STATE_REPO_TOKEN}@github.com/${STATE_REPO}.git" "$RUNNER_TEMP/state"
      - name: Collect and build an isolated static batch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work"
          PYTHONPATH=src python -m ai_info_web.cli run-daily \
            --db "$RUNNER_TEMP/work/ai-info-web.sqlite3" \
            --state-dir "$RUNNER_TEMP/state" \
            --output "$RUNNER_TEMP/public"
      - name: Commit private state after successful build
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/state"
          git config user.name "ai-info-web-actions"
          git config user.email "ai-info-web-actions@users.noreply.github.com"
          git add ai-info-web.sqlite3
          git diff --cached --quiet || git commit -m "chore: persist daily intelligence state"
          git push
      - name: Publish verified CloudBase upload package
        uses: actions/upload-artifact@v4
        with:
          name: cloudbase-static-site
          path: ${{ runner.temp }}/public
          if-no-files-found: error
          retention-days: 7
