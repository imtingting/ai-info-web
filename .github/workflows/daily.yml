name: Weekly AI product intelligence

on:
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:
    inputs:
      bootstrap_static:
        description: "Skip bounded DeepSeek summaries for an emergency static publication."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STATE_REPO: ${{ secrets.STATE_REPO }}
      STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CHAT_API_URL: ${{ vars.CHAT_API_URL }}
      TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
      TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
      CLOUDBASE_DEPLOY_PATH: ${{ vars.CLOUDBASE_DEPLOY_PATH }}
      # Optional GitHub enrichment runs in its own short workflow. Keeping it
      # out of the publication path prevents external timeouts from discarding
      # an otherwise valid static package.
      GITHUB_MAX_ENRICHMENT_ITEMS: "0"
      GITHUB_MAX_STARGAZER_PREFILL_ITEMS: "0"
      GITHUB_MAX_STARGAZER_PAGES: "1"
      SUMMARY_MAX_ITEMS: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Restore private state
        run: |
          set -euo pipefail
          test -n "$STATE_REPO"
          test -n "$STATE_REPO_TOKEN"
          git clone --depth=1 "https://x-access-token:${STATE_REPO_TOKEN}@github.com/${STATE_REPO}.git" "$RUNNER_TEMP/state"
      - name: Collect and build an isolated static batch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work"
          PYTHONPATH=src python -m ai_info_web.cli run-daily \
            --db "$RUNNER_TEMP/work/ai-info-web.sqlite3" \
            --state-dir "$RUNNER_TEMP/state" \
            --output "$RUNNER_TEMP/public"
      - name: Commit private state after successful build
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/state"
          git config user.name "ai-info-web-actions"
          git config user.email "ai-info-web-actions@users.noreply.github.com"
          git add ai-info-web.sqlite3
          git diff --cached --quiet || git commit -m "chore: persist daily intelligence state"
          git push
      - name: Publish verified CloudBase upload package
        uses: actions/upload-artifact@v4
        with:
          name: cloudbase-static-site
          path: ${{ runner.temp }}/public
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install CloudBase CLI
        run: |
          npm install -g @cloudbase/cli || \
            npm install -g @cloudbase/cli --registry=http://mirrors.cloud.tencent.com/npm/
      - name: Deploy to CloudBase Static Hosting
        env:
          CI: "true"
          COS_SDK_KEEPALIVE: "false"
        run: |
          set -euo pipefail
          test -n "$TCB_SECRET_ID"
          test -n "$TCB_SECRET_KEY"
          test -n "$TCB_ENV_ID"
          DEPLOY_PATH="${CLOUDBASE_DEPLOY_PATH:-/ai-info-web}"
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
          tcb hosting deploy "$RUNNER_TEMP/public" "$DEPLOY_PATH" \
            -e "$TCB_ENV_ID"
